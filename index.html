:root{--steel-900:#13171D;--steel-850:#171C23;--steel-800:#1C222B;--steel-700:#232B35;--steel-600:#323C49;--line:#39424F;--gold:#C9A24B;--gold-lt:#E4C87E;--gold-deep:#8A6A26;--argent:#DBE0E7;--muted:#8A94A1;--crimson:#9E3742;--pos:#5FB98C;--neg:#D9737B}
*{box-sizing:border-box}
.sac-root{font-family:Inter,system-ui,sans-serif;color:var(--argent);background:radial-gradient(1200px 500px at 50% -10%,rgba(201,162,75,.10),transparent 60%),linear-gradient(180deg,#12161C,#0E1116 60%);min-height:100vh;max-width:760px;margin:0 auto;padding-bottom:60px;-webkit-font-smoothing:antialiased}
.sac-root input,.sac-root select{font-family:inherit}
.sac-head{position:relative;display:flex;gap:15px;align-items:center;padding:20px 20px 15px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(201,162,75,.07),transparent)}
.sac-crest{filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));flex:none}
.sac-eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:5px}
.sac-title{font-family:Cinzel,serif;font-weight:700;font-size:24px;line-height:1.05;margin:0;color:var(--gold-lt);text-shadow:0 1px 0 #000,0 0 22px rgba(201,162,75,.18)}
.sac-sub{font-size:11.5px;color:var(--muted);margin-top:6px}
.sac-me{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:7px;background:var(--steel-800);border:1px solid var(--line);border-radius:20px;padding:6px 12px 6px 10px;cursor:pointer;color:var(--argent);font-size:12px;font-weight:600}
.sac-me-n{max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sac-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}.sac-dot.live{background:#4fd18b;box-shadow:0 0 8px rgba(79,209,139,.6)}
.sac-tabs{display:flex;gap:2px;padding:8px 10px 0;overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#12161Cfa,#12161Cd0);backdrop-filter:blur(6px)}
.sac-tab{flex:none;background:none;border:none;color:var(--muted);font-family:Cinzel,serif;font-size:12.5px;letter-spacing:.04em;padding:11px 12px;cursor:pointer;border-bottom:2px solid transparent;font-weight:600;white-space:nowrap}
.sac-tab.on{color:var(--gold-lt);border-bottom-color:var(--gold)}
.sac-main{padding:16px 16px 24px}
.sac-segrow{margin-bottom:10px}.sac-segrow.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sac-seg{display:inline-flex;background:var(--steel-800);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.sac-seg.wrap{flex-wrap:wrap}.sac-seg.full{display:flex;width:100%;margin-bottom:10px}.sac-seg.full .sac-segbtn{flex:1}.sac-seg.full.wrap{flex-wrap:wrap}.sac-seg.full.wrap .sac-segbtn{flex:1 1 auto}
.sac-seg.big{margin-bottom:14px}.sac-seg.big .sac-segbtn{padding:10px 14px;font-size:13px}
.sac-segbtn{background:none;border:none;color:var(--muted);font-size:12px;font-weight:600;padding:8px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.sac-segbtn.on{background:linear-gradient(180deg,var(--steel-600),var(--steel-700));color:var(--gold-lt);box-shadow:inset 0 0 0 1px var(--gold-deep)}
.sac-coursetag{font-size:11.5px;color:var(--gold-lt);margin:-2px 0 10px;letter-spacing:.02em}
.sac-playerbar{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px}
.sac-chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--steel-800);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;min-width:60px}
